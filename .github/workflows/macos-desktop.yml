name: macOS Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: Desktop version
        required: true
        default: 1.0.0
      publish_release:
        description: Publish GitHub Release
        type: boolean
        required: true
        default: false
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: macos-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache-dependency-path: native/tailcat-bridge/go.mod

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve desktop version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#desktop-v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          else
            version="1.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid desktop version: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate release signing credentials
        if: github.ref_type == 'tag' || inputs.publish_release == true
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          missing=()
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD MACOS_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Formal macOS release requires signing/notarization secrets: ${missing[*]}"
            exit 1
          fi

      - name: Build native macOS bundle
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          ARCH: ${{ matrix.arch }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./apps/desktop-macos/build.sh

      - name: Verify Tailcat runtime payload
        shell: bash
        run: |
          runtime=".desktop-macos-build/${{ matrix.arch }}/Codex Relay Plus.app/Contents/Resources/runtime"
          test -x "$runtime/tailcat-relay-server"
          test -x "$runtime/node-bin"
          test -x "$runtime/node"
          "$runtime/tailcat-relay-server" --help >/dev/null
          bash -n "$runtime/node"

      - name: Upload DMG
        uses: actions/upload-artifact@v6
        with:
          name: Codex-Relay-Plus_${{ steps.version.outputs.version }}_${{ matrix.arch }}
          path: |
            .desktop-macos-build/${{ matrix.arch }}/*.dmg
            .desktop-macos-build/${{ matrix.arch }}/*.dmg.sha256
          if-no-files-found: error

  release:
    name: Publish desktop release
    needs: build
    if: github.ref_type == 'tag' || inputs.publish_release == true
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: Codex-Relay-Plus_*
          merge-multiple: true
          path: dist

      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#desktop-v}"
          else
            version="$INPUT_VERSION"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="desktop-v$VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Codex Relay Plus for macOS v$VERSION" --notes "Native macOS desktop release for Apple Silicon and Intel, including the pinned Tailcat transport helper."
          fi
          gh release upload "$tag" dist/* --clobber
