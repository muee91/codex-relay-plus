name: Release

on:
  push:
    branches:
      - main
    paths:
      - ".changeset/**"
      - "packages/codex-relay/**"
      - "scripts/version-packages.mjs"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect npm package release
        id: npm-release
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          current_version="$(node -p 'require("./packages/codex-relay/package.json").version')"
          previous_version=""
          if [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            previous_package="$(git show "$BEFORE_SHA:packages/codex-relay/package.json" 2>/dev/null || true)"
            if [[ -n "$previous_package" ]]; then
              previous_version="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).version)' "$previous_package")"
            fi
          fi

          publish=false
          if [[ -n "$previous_version" && "$previous_version" != "$current_version" ]]; then
            publish=true
          fi

          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "previous-version=${previous_version:-unknown}" >> "$GITHUB_OUTPUT"
          echo "current-version=$current_version" >> "$GITHUB_OUTPUT"

      - name: Publish npm package
        if: steps.npm-release.outputs.publish == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm release

      - name: Read pending npm release plan
        id: npm-release-plan
        run: |
          pnpm changeset status --output=/tmp/changeset-status.json
          relay_release_version="$(node -e '
            const status = require(process.argv[1]);
            const release = status.releases.find(({ name }) => name === "codex-relay");
            if (release) process.stdout.write(release.newVersion);
          ' /tmp/changeset-status.json)"
          echo "release-version=$relay_release_version" >> "$GITHUB_OUTPUT"

      - name: Configure release commit author
        if: steps.npm-release-plan.outputs.release-version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update npm release branch
        if: steps.npm-release-plan.outputs.release-version != ''
        run: |
          git switch --create changeset-release/npm-main "$GITHUB_SHA"
          pnpm version-packages:npm
          git add .changeset packages/codex-relay
          git commit -m "chore: release codex-relay"
          git push --force-with-lease origin HEAD:refs/heads/changeset-release/npm-main

      - name: Create or update npm release pull request
        if: steps.npm-release-plan.outputs.release-version != ''
        uses: actions/github-script@v9
        env:
          RELAY_RELEASE_VERSION: ${{ steps.npm-release-plan.outputs.release-version }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = "changeset-release/npm-main";
            const title = `chore: release codex-relay@${process.env.RELAY_RELEASE_VERSION}`;
            const body = [
              "## npm package release",
              "",
              `- Package: \`codex-relay@${process.env.RELAY_RELEASE_VERSION}\``,
              "- Deployment: npm publish after merge",
            ].join("\n");

            const { data: pullRequests } = await github.rest.pulls.list({
              ...context.repo,
              base: "main",
              head: `${context.repo.owner}:${branch}`,
              state: "open",
            });
            const pullRequest = pullRequests[0];
            if (pullRequest) {
              await github.rest.pulls.update({
                ...context.repo,
                pull_number: pullRequest.number,
                title,
                body,
              });
            } else {
              await github.rest.pulls.create({
                ...context.repo,
                base: "main",
                head: branch,
                title,
                body,
              });
            }
