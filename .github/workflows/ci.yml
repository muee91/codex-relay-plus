name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, format, and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Print exact formatter patch
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/mobile/src/lib/codex-relay-connection-manager.ts
            packages/codex-relay/src/index.ts
            packages/codex-relay/src/network-state-manager.ts
            packages/codex-relay/src/pairing-url-candidates.ts
          )
          pnpm exec oxfmt "${files[@]}" --write
          git diff -- "${files[@]}"
          exit 1
