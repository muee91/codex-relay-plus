name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, format, typecheck, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec oxlint apps packages --import-plugin --react-plugin --jsx-a11y-plugin --vitest-plugin

      - name: Format feature files for validation
        run: pnpm exec oxfmt apps/mobile/src/app/pair.tsx apps/mobile/src/components/chat/ChatScreen.tsx apps/mobile/src/components/chat/ChatShell.tsx apps/mobile/src/components/chat/ChatShellHeader.tsx apps/mobile/src/components/chat/ThreadDrawerContent.tsx apps/mobile/src/lib/codex-relay-api.ts apps/mobile/src/lib/codex-relay-hosts.ts apps/mobile/src/lib/codex-relay-server-url-storage.ts apps/mobile/src/lib/secure-transport.ts

      - name: Print formatter diff
        run: git diff -- apps/mobile/src/app/pair.tsx apps/mobile/src/components/chat/ChatScreen.tsx apps/mobile/src/components/chat/ChatShell.tsx apps/mobile/src/components/chat/ChatShellHeader.tsx apps/mobile/src/components/chat/ThreadDrawerContent.tsx apps/mobile/src/lib/codex-relay-api.ts apps/mobile/src/lib/codex-relay-hosts.ts apps/mobile/src/lib/codex-relay-server-url-storage.ts apps/mobile/src/lib/secure-transport.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Test relay
        run: pnpm test

      - name: Test release version policy
        run: pnpm test:release

  desktop-macos:
    name: Build macOS desktop host
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
          cache-dependency-path: native/tailcat-bridge/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop app
        run: MACOS_APP_ONLY=1 bash apps/desktop-macos/build.sh
