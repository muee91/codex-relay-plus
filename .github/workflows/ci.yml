name: CI

on:
  push:
    branches:
      - main
      - feat/tailcat-complete
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  checks:
    name: Lint, format, and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and check formatting
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test release version policy
        run: pnpm test:release

  native-tailcat:
    name: Tailcat native (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.1
          cache-dependency-path: native/tailcat-bridge/go.sum

      - name: Test Tailcat bridge
        working-directory: native/tailcat-bridge
        run: go test ./...

      - name: Build Android binding
        if: matrix.platform == 'android'
        run: bash apps/mobile/scripts/build-tailcat-android.sh

      - name: Build iOS binding
        if: matrix.platform == 'ios'
        run: bash apps/mobile/scripts/build-tailcat-ios.sh
