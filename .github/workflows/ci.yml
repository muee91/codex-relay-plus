name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, format, and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Show exact formatter diff
        run: |
          pnpm exec oxfmt apps/mobile/src/lib/codex-relay-connection-manager.ts packages/codex-relay/src/control-center.ts --write
          git diff --no-ext-diff -- apps/mobile/src/lib/codex-relay-connection-manager.ts packages/codex-relay/src/control-center.ts
          exit 1

      - name: Lint and check formatting
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test release version policy
        run: pnpm test:release
