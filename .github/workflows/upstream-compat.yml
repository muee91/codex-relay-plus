name: Upstream compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/upstream-compat.yml"
      - "apps/**"
      - "packages/**"
      - "native/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: upstream-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-and-test:
    name: Merge gronxb/main and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Merge current upstream main without committing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "codex-relay-plus compatibility bot"
          git config user.email "compatibility-bot@users.noreply.github.com"
          git remote add upstream https://github.com/gronxb/codex-relay.git
          git fetch --no-tags upstream main
          if ! git merge --no-commit --no-ff upstream/main; then
            echo "::error::Fork no longer merges cleanly with gronxb/codex-relay main"
            echo "Conflicted paths:"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          echo "Upstream commit: $(git rev-parse upstream/main)"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Relay tests
        run: pnpm test
