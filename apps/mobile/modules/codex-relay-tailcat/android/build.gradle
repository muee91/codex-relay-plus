plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.codexrelaytailcat'
version = '0.1.0'

android {
  namespace 'expo.modules.codexrelaytailcat'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation files('libs/tailcatbridge.aar')
}
